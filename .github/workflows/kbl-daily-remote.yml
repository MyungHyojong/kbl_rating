name: KBL daily ratings

on:
  schedule:
    # GitHub Actions cron is UTC.
    # Mon–Fri 21:00 Asia/Seoul: 30 DCInside list pages.
    - cron: "0 12 * * 1-5"
    # Sat–Sun 17:07 Asia/Seoul: 80 DCInside list pages.
    # Avoid an exact-hour cron slot, which GitHub may delay under load.
    - cron: "7 8 * * 0,6"
  workflow_dispatch:
    inputs:
      run_date:
        description: "KBL 경기일 (YYYYMMDD, 비우면 UTC 오늘)"
        required: false
        type: string
      pages:
        description: "목록 마지막 페이지 (수동 실행에서만 지정; 자동은 평일 30·주말 80)"
        required: false
        type: string
      publish_pages:
        description: "성공한 docs/ 팀 페이지를 main에 커밋"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: kbl-daily-ratings
  cancel-in-progress: false

jobs:
  collect-and-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      # Scheduled workflows publish automatically. Manual executions may opt out.
      PUBLISH_TEAM_PAGES: ${{ (github.event_name == 'schedule' || inputs.publish_pages) && '1' || '0' }}
      SCHEDULE_PAGES: ${{ github.event.schedule == '7 8 * * 0,6' && '80' || '30' }}
      PYTHONUTF8: "1"
      TZ: Asia/Seoul

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configure GitHub Actions commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify headless Chrome
        run: |
          google-chrome --version
          python -c "from selenium import webdriver; from selenium.webdriver.chrome.options import Options; o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); d=webdriver.Chrome(options=o); print(d.title); d.quit()"

      - name: Run KBL pipeline
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          args=()
          run_date="${{ inputs.run_date }}"
          if [ -z "$run_date" ]; then run_date="$(date +%Y%m%d)"; fi
          echo "RUN_DATE=$run_date" >> "$GITHUB_ENV"
          args+=(--date "$run_date")
          if [ -n "${{ inputs.pages }}" ]; then
            args+=(--pages "${{ inputs.pages }}")
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--pages "$SCHEDULE_PAGES")
          fi
          python weekday_kbl_runner.py "${args[@]}"

      - name: Send completed cards to ntfy
        if: steps.pipeline.outcome == 'success'
        shell: bash
        run: python ntfy_notify.py --input-dir "runs/$RUN_DATE"

      - name: Add run summary
        if: always()
        shell: bash
        run: |
          echo "## KBL daily ratings" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipeline: **${{ steps.pipeline.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raw DCInside HTML and Gemini CSVs are stored only as a private workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "- Public team pages are committed only when the pipeline completes." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kbl-run-${{ github.run_id }}
          path: |
            runs/**
            *.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if pipeline did not complete
        if: steps.pipeline.outcome != 'success'
        run: exit 1
