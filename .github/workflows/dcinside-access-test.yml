name: DCInside access test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dcinside-access-test.yml

jobs:
  browser-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Selenium
        run: python -m pip install selenium

      - name: Open one DCInside page in headless Chrome
        env:
          TARGET_URL: https://gall.dcinside.com/mgallery/board/lists?id=basketballkorea&page=1
        run: |
          python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1440,1200")

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(os.environ["TARGET_URL"])
              source = driver.page_source
              blocked = any(word in source.lower() for word in [
                  "비정상적인 접근",
                  "접근이 제한",
                  "access denied",
                  "captcha",
              ])
              rows = len(driver.find_elements(By.CSS_SELECTOR, "tr.ub-content"))

              print(f"title={driver.title!r}")
              print(f"current_url={driver.current_url}")
              print(f"post_rows={rows}")
              print(f"blocked={blocked}")

              if blocked or rows == 0:
                  raise SystemExit(
                      "DCInside listing was blocked or not rendered on the GitHub runner"
                  )
          finally:
              driver.quit()
          PY
